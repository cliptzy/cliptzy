name: Release Tauri App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-13"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-24.04"
            args: "-- --features gpu-vulkan"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04"
            args: "--runner cargo-xwin --target x86_64-pc-windows-msvc -- --features gpu-vulkan"
            target: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            libappindicator3-dev \
            libvulkan-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libglib2.0-dev \
            lld \
            llvm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vulkan SDK (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Windows dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04' && matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          sudo apt-get install -y nsis
          rustup target add x86_64-pc-windows-msvc
          cargo install --locked cargo-xwin

      - name: Install frontend dependencies
        run: bun install

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cliptzy ${{ github.ref_name }}"
          releaseBody: "Pembaruan terbaru untuk Cliptzy."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

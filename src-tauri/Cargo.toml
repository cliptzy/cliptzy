[package]
name = "cliptzy"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cliptzy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15.7"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
zip = "2"
tauri-plugin-shell = "2"
dirs = "6"
ctrlc = "3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
yt-dlp = "2.8.3"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.2"
url = "2.5.8"
dotenvy = "0.15.7"
opener = "0.8.5"
sysinfo = "0.39.6"
once_cell = "1.21.4"
thiserror = "2.0.20"
tokio-util = "0.7.19"
uuid = { version = "1.25.0", features = ["v4"] }
rust_ffmpeg = "1.0.0"
rust_ffprobe = "1.0.0"
whisper-rs = "0.16.0"
hound = "3.5.1"
rustfft = "6.4.0"
async-trait = "0.1.92"
regex = "1.13.1"
rustface = "0.1.7"
image = "0.25.10"
tempfile = "3.27.0"
which = "8.0.6"
optical-flow-lk = "0.3.1"
tauri-plugin-log = "2.9.0"
log = "0.4.34"
ndarray = "0.17.2"
rayon = "1.11.0"
tauri-plugin-store = "2.4.4"
rig-core = "0.42.0"
tokenizers = "0.23.2"

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["directml"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
ort = { version = "2.0.0-rc.13" }

[features]
default = []
gpu-vulkan = ["whisper-rs/vulkan"]
gpu-cuda = ["whisper-rs/cuda"]
gpu-metal = ["whisper-rs/metal"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[patch.crates-io]
esaxx-rs = { git = "https://github.com/mozilla-ai/esaxx-rs-dyn-msvc" }
